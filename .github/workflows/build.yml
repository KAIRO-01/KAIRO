name: Build KAIRO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Add Vosk wake word model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q model.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/model-en-us
          uuidgen > app/src/main/assets/model-en-us/uuid

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              grep -n -E "^e: |What went wrong|Could not resolve|Could not find|error:|FAILURE" -A4 build.log | head -150
              echo "----- LOG TAIL -----"
              tail -30 build.log
            } > error-summary.txt
            echo "===== KAIRO ERROR SUMMARY ====="
            cat error-summary.txt
            echo "===== END SUMMARY ====="
          fi
          exit $code

      - name: Publish error summary
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f error-summary.txt ] || echo "Build gradle se pehle fail hua (model download ya setup step)." > error-summary.txt
          gh release create "error-${{ github.run_number }}" \
            --title "KAIRO build ${{ github.run_number }} ERROR" \
            --notes-file error-summary.txt \
            --prerelease

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KAIRO-debug.apk
          gh release create "build-${{ github.run_number }}" KAIRO-debug.apk \
            --title "KAIRO build ${{ github.run_number }}" \
            --notes "Debug APK"
